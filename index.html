<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hứng Vàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c2a2b;
    --panel: #f6efe0;
    --panel-ink: #14211f;
    --panel-sub: #5b6a64;
    --accent: #f2a541;
    --accent-ink: #2a1a05;
    --danger: #c8402f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #071a1b;
      --panel: #17302d;
      --panel-ink: #f6efe0;
      --panel-sub: #a9b8b0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #071a1b;
    --panel: #17302d;
    --panel-ink: #f6efe0;
    --panel-sub: #a9b8b0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--panel-ink);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; overflow: hidden; border-radius: 14px; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 16px; pointer-events: none; color: #f6efe0;
  }
  .score { font-weight: 800; font-size: 34px; line-height: 1; }
  .score small { display: block; font-weight: 500; font-size: 12px; opacity: .7; margin-top: 4px; }
  .lives { font-size: 22px; letter-spacing: 3px; color: var(--accent); }
  .lives .lost { color: rgba(246,239,224,.25); }
  .author {
    position: absolute; right: 12px; bottom: 10px;
    font-size: 11px; font-weight: 500; color: rgba(246,239,224,.35);
    pointer-events: none; letter-spacing: 0.5px;
  }

  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(7,26,27,.55); padding: 24px;
  }
  .overlay[hidden] { display: none; }
  .card {
    background: var(--panel); color: var(--panel-ink);
    border-radius: 18px; padding: 26px 24px; width: 100%; max-width: 300px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .card h1 { margin: 0 0 8px; font-size: 32px; font-weight: 800; line-height: 1.1; }
  .card p { margin: 0 0 18px; font-size: 15px; line-height: 1.5; color: var(--panel-sub); }
  .card .big { font-size: 44px; font-weight: 800; color: var(--panel-ink); line-height: 1; margin: 6px 0; }
  .card .best { margin: 0 0 18px; font-size: 14px; color: var(--panel-sub); }
  button {
    font: inherit; font-weight: 800; font-size: 17px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 12px; padding: 14px 28px; width: 100%; cursor: pointer;
  }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 3px solid var(--panel-ink); outline-offset: 3px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div class="hud" aria-live="polite">
      <div class="score"><span id="score">0</span><small id="level">Cấp 1</small></div>
      <div class="lives" id="lives">♥♥♥</div>
    </div>
    <div class="author">Đào Trung</div>

    <div class="overlay" id="startScreen">
      <div class="card">
        <h1>Hứng Vàng</h1>
        <p>Kéo ngón tay để di chuyển thúng. Hứng bạc (+10), vàng (+50), kim cương (+100). Tránh đá rơi!</p>
        <button id="playBtn">Chơi</button>
      </div>
    </div>

    <div class="overlay" id="overScreen" hidden>
      <div class="card">
        <h1>Hết lượt</h1>
        <div class="big" id="finalScore">0</div>
        <p class="best" id="bestText">Kỷ lục: 0</p>
        <button id="againBtn">Chơi lại</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var LW = 360, LH = 640;
  var stage = document.getElementById('stage');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score');
  var levelEl = document.getElementById('level');
  var livesEl = document.getElementById('lives');
  var startScreen = document.getElementById('startScreen');
  var overScreen = document.getElementById('overScreen');
  var finalScoreEl = document.getElementById('finalScore');
  var bestTextEl = document.getElementById('bestText');

  var scale = 1, dpr = 1;

  function resize() {
    var wrap = document.getElementById('wrap');
    var aw = wrap.clientWidth, ah = wrap.clientHeight;
    scale = Math.min(aw / LW, ah / LH);
    dpr = window.devicePixelRatio || 1;
    stage.style.width = Math.floor(LW * scale) + 'px';
    stage.style.height = Math.floor(LH * scale) + 'px';
    cv.width = Math.round(LW * scale * dpr);
    cv.height = Math.round(LH * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- state ----------
  var state = 'ready'; // ready | play | over
  var score, lives, level, items, spawnTimer, shake, flash, time, floats;
  var fireworks = [], levelMsg = 0;
  var player = { x: LW / 2, target: LW / 2, y: LH - 92, w: 84, h: 34 };
  var best = 0;
  try { best = parseInt(localStorage.getItem('hungvang_best') || '0', 10) || 0; } catch (e) {}

  function reset() {
    score = 0; lives = 3; level = 1; items = []; floats = []; fireworks = []; levelMsg = 0; spawnTimer = 0.4; shake = 0; flash = 0; lastThemeIdx = -1;
    player.x = player.target = LW / 2;
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    var prevTotal = 0; for (var l = 1; l < level; l++) prevTotal += pointsForLevel(l);
    var need = pointsForLevel(level);
    var cur = score - prevTotal;
    levelEl.textContent = 'Cấp ' + level + ' (' + cur + '/' + need + ')';
    var h = '';
    for (var i = 0; i < 3; i++) h += i < lives ? '♥' : '<span class="lost">♥</span>';
    livesEl.innerHTML = h;
  }

  // ---------- audio ----------
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ---------- level thresholds ----------
  // lv1: 1000, lv2: 3000, lv3: 5000, lv4: 7000 ... (+2000 mỗi lv từ lv2)
  function pointsForLevel(lv) { return lv === 1 ? 1000 : 1000 + (lv - 1) * 2000; }
  function calcLevel(pts) {
    var lv = 1, total = 0;
    while (true) {
      total += pointsForLevel(lv);
      if (pts < total) return lv;
      lv++;
    }
  }

  // ---------- spawn ----------
  function spawn() {
    var rockChance = Math.min(0.42, 0.2 + level * 0.02);
    var roll = Math.random();
    var type;
    if (roll < rockChance) {
      type = 'rock';
    } else {
      // silver 60%, gold 28%, diamond 12%
      var loot = Math.random();
      if (loot < 0.60) type = 'silver';
      else if (loot < 0.88) type = 'gold';
      else type = 'diamond';
    }

    var r = type === 'rock' ? 16 + Math.random() * 8
          : type === 'diamond' ? 15
          : type === 'gold' ? 14 : 12;

    var it = {
      type: type,
      x: r + Math.random() * (LW - 2 * r),
      y: -r,
      r: r,
      vy: (150 + Math.random() * 40) * Math.pow(1.02, level - 1),
      rot: Math.random() * 6.28,
      spin: (Math.random() - 0.5) * 3,
      pts: []
    };
    if (type === 'rock') {
      var n = 7;
      for (var i = 0; i < n; i++) {
        var a = (i / n) * 6.28;
        var rr = r * (0.78 + Math.random() * 0.3);
        it.pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
      }
    }
    items.push(it);
  }

  // ---------- update ----------
  function update(dt) {
    time += dt;
    updateWeather(dt);
    if (state !== 'play') return;

    player.x += (player.target - player.x) * Math.min(1, dt * 16);
    var half = player.w / 2;
    player.x = Math.max(half, Math.min(LW - half, player.x));

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = Math.max(0.25, 0.85 / Math.pow(1.02, level - 1)) * (0.7 + Math.random() * 0.6);
    }

    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      it.y += it.vy * dt;
      it.rot += it.spin * dt;

      var inX = Math.abs(it.x - player.x) < player.w / 2 + it.r * 0.2;
      var inY = it.y + it.r > player.y && it.y < player.y + 22;
      if (inX && inY) {
        if (it.type !== 'rock') {
          var pts = it.type === 'diamond' ? 100 : it.type === 'gold' ? 50 : 10;
          score += pts;
          var nl = calcLevel(score);
          if (nl !== level) {
            level = nl;
            beep(1200, 0.25, 'triangle', 0.07);
            spawnFireworks();
            levelMsg = 2.5; // show message for 2.5 seconds
          }
          if (it.type === 'diamond') { beep(1320, 0.15, 'sine', 0.08); beep(1760, 0.12, 'sine', 0.06); }
          else if (it.type === 'gold') beep(1050, 0.1, 'sine', 0.07);
          else beep(880, 0.08, 'sine', 0.06);
          // floating score text
          floats.push({ x: it.x, y: it.y, text: '+' + pts, life: 0.7, color: it.type === 'diamond' ? '#7fdbff' : it.type === 'gold' ? '#f2a541' : '#d0d0d0' });
        } else {
          lives--;
          shake = 0.3; flash = 0.25;
          beep(120, 0.3, 'sawtooth', 0.08);
        }
        items.splice(i, 1);
        updateHud();
        if (lives <= 0) { gameOver(); return; }
        continue;
      }
      if (it.y - it.r > LH) items.splice(i, 1);
    }

    if (shake > 0) shake -= dt;
    if (flash > 0) flash -= dt;
    if (levelMsg > 0) levelMsg -= dt;
    for (var j = floats.length - 1; j >= 0; j--) {
      floats[j].life -= dt;
      floats[j].y -= 60 * dt;
      if (floats[j].life <= 0) floats.splice(j, 1);
    }
    // update firework particles
    for (var k = fireworks.length - 1; k >= 0; k--) {
      var p = fireworks[k];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 120 * dt; // gravity
      p.life -= dt;
      if (p.life <= 0) fireworks.splice(k, 1);
    }
  }

  // ---------- fireworks ----------
  var fwColors = ['#f2a541','#7fdbff','#ff6b6b','#51e898','#c792ea','#ff9ff3','#ffeaa7','#fd79a8'];
  function spawnFireworks() {
    // 3 bursts at random positions
    for (var b = 0; b < 3; b++) {
      var cx = 60 + Math.random() * (LW - 120);
      var cy = 80 + Math.random() * 200;
      var color = fwColors[Math.floor(Math.random() * fwColors.length)];
      var count = 25 + Math.floor(Math.random() * 15);
      for (var i = 0; i < count; i++) {
        var angle = Math.random() * 6.283;
        var speed = 60 + Math.random() * 140;
        fireworks.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 40,
          life: 0.6 + Math.random() * 0.8,
          maxLife: 1.4,
          r: 1.5 + Math.random() * 2,
          color: color
        });
      }
    }
    // celebration sounds
    setTimeout(function(){ beep(1400, 0.12, 'sine', 0.05); }, 0);
    setTimeout(function(){ beep(1700, 0.12, 'sine', 0.05); }, 100);
    setTimeout(function(){ beep(2100, 0.15, 'sine', 0.06); }, 200);
  }

  function gameOver() {
    state = 'over';
    if (score > best) {
      best = score;
      try { localStorage.setItem('hungvang_best', String(best)); } catch (e) {}
    }
    finalScoreEl.textContent = score;
    bestTextEl.textContent = 'Kỷ lục: ' + best;
    overScreen.hidden = false;
  }

  // ========== WEATHER / THEME SYSTEM ==========
  // Themes cycle: 1=Starry Night, 2=Rain, 3=Snow, 4=Sunset, 5=Thunderstorm,
  //               6=Cherry Blossom, 7=Sandstorm, 8=Aurora, then repeat
  var themes = [
    { name:'Đêm sao',     sky:['#05101a','#0a1a2e','#0c2a2b','#1b5a4e'], moon:true,  weatherType:'stars' },
    { name:'Mưa rào',      sky:['#1a2a3a','#2a3a4a','#3a4a55','#2a3a3a'], moon:false, weatherType:'rain' },
    { name:'Tuyết rơi',    sky:['#c8d6e5','#dfe6ed','#eef2f7','#f0f4f8'], moon:false, weatherType:'snow' },
    { name:'Hoàng hôn',    sky:['#1a0533','#6b1839','#c74b2a','#f2a541'], moon:false, weatherType:'none' },
    { name:'Giông bão',    sky:['#0d1117','#1a1f2e','#252b3a','#1a2028'], moon:false, weatherType:'thunder' },
    { name:'Hoa anh đào',  sky:['#2d1b3d','#4a2050','#d4729a','#f8c8dc'], moon:false, weatherType:'petals' },
    { name:'Bão cát',      sky:['#5c4a32','#8b7355','#c4a56e','#d4b87a'], moon:false, weatherType:'sand' },
    { name:'Cực quang',    sky:['#050a18','#0a1225','#0c1a30','#101828'], moon:true,  weatherType:'aurora' }
  ];
  function getTheme() { return themes[((level - 1) % themes.length)]; }

  // weather particles (shared pool, re-inited on level change)
  var wParts = [], lastThemeIdx = -1, lightning = 0;

  function initWeather() {
    var idx = (level - 1) % themes.length;
    if (idx === lastThemeIdx) return;
    lastThemeIdx = idx;
    wParts = [];
    var th = themes[idx];
    if (th.weatherType === 'stars') {
      for (var i = 0; i < 120; i++) wParts.push({ x:Math.random()*LW, y:Math.random()*LH, r:0.4+Math.random()*1.8, sp:8+Math.random()*25, tw:1.5+Math.random()*3, to:Math.random()*6.28, br:0.4+Math.random()*0.6 });
      for (var j = 0; j < 3; j++) wParts.push({ x:Math.random()*LW, y:Math.random()*LH*0.5, r:1.2, sp:80+Math.random()*60, tw:0, to:0, br:1, shoot:true, vx:-30-Math.random()*40, tail:20+Math.random()*15 });
    } else if (th.weatherType === 'rain') {
      for (var i = 0; i < 200; i++) wParts.push({ x:Math.random()*LW, y:Math.random()*LH, sp:400+Math.random()*300, len:12+Math.random()*18, w:0.8+Math.random()*0.7 });
    } else if (th.weatherType === 'snow') {
      for (var i = 0; i < 100; i++) wParts.push({ x:Math.random()*LW, y:Math.random()*LH, r:1.5+Math.random()*3, sp:20+Math.random()*40, drift:Math.random()*6.28, dsp:0.5+Math.random()*1.5 });
    } else if (th.weatherType === 'thunder') {
      for (var i = 0; i < 180; i++) wParts.push({ x:Math.random()*LW, y:Math.random()*LH, sp:500+Math.random()*350, len:14+Math.random()*20, w:1+Math.random()*0.8 });
    } else if (th.weatherType === 'petals') {
      for (var i = 0; i < 60; i++) wParts.push({ x:Math.random()*LW, y:Math.random()*LH, r:3+Math.random()*4, sp:25+Math.random()*35, drift:Math.random()*6.28, dsp:1+Math.random()*2, rot:Math.random()*6.28, rspin:1+Math.random()*2 });
    } else if (th.weatherType === 'sand') {
      for (var i = 0; i < 150; i++) wParts.push({ x:Math.random()*LW, y:Math.random()*LH, r:1+Math.random()*2, sp:15+Math.random()*30, vx:60+Math.random()*80, alpha:0.2+Math.random()*0.4 });
    } else if (th.weatherType === 'aurora') {
      for (var i = 0; i < 80; i++) wParts.push({ x:Math.random()*LW, y:Math.random()*LH, r:0.4+Math.random()*1.8, sp:8+Math.random()*20, tw:1.5+Math.random()*3, to:Math.random()*6.28, br:0.4+Math.random()*0.6 });
    }
  }
  function updateWeather(dt) {
    initWeather(); // check if theme changed
    var th = getTheme();
    if (th.weatherType === 'stars' || th.weatherType === 'aurora') {
      for (var i = 0; i < wParts.length; i++) { var p=wParts[i]; p.y+=p.sp*dt; if(p.shoot){p.x+=p.vx*dt; if(p.y>LH+10||p.x<-50){p.x=LW*0.3+Math.random()*LW*0.7;p.y=-10-Math.random()*50;}} else if(p.y>LH+5){p.y=-5;p.x=Math.random()*LW;} }
    } else if (th.weatherType === 'rain' || th.weatherType === 'thunder') {
      for (var i = 0; i < wParts.length; i++) { var p=wParts[i]; p.y+=p.sp*dt; p.x-=30*dt; if(p.y>LH+20){p.y=-20;p.x=Math.random()*LW;} if(p.x<-10)p.x=LW+5; }
      if (th.weatherType === 'thunder') { lightning -= dt; if (lightning <= 0 && Math.random() < 0.005) lightning = 0.08 + Math.random() * 0.12; }
    } else if (th.weatherType === 'snow') {
      for (var i = 0; i < wParts.length; i++) { var p=wParts[i]; p.y+=p.sp*dt; p.drift+=p.dsp*dt; p.x+=Math.sin(p.drift)*0.8; if(p.y>LH+10){p.y=-10;p.x=Math.random()*LW;} }
    } else if (th.weatherType === 'petals') {
      for (var i = 0; i < wParts.length; i++) { var p=wParts[i]; p.y+=p.sp*dt; p.drift+=p.dsp*dt; p.x+=Math.sin(p.drift)*1.2+15*dt; p.rot+=p.rspin*dt; if(p.y>LH+10||p.x>LW+20){p.y=-10;p.x=Math.random()*LW;} }
    } else if (th.weatherType === 'sand') {
      for (var i = 0; i < wParts.length; i++) { var p=wParts[i]; p.y+=p.sp*dt; p.x+=p.vx*dt; if(p.x>LW+10){p.x=-10;p.y=Math.random()*LH;} if(p.y>LH+5){p.y=-5;} }
    }
  }

  // ---------- draw ----------
  function drawBackground() {
    var th = getTheme();
    // sky gradient
    var g = ctx.createLinearGradient(0, 0, 0, LH);
    for (var i = 0; i < th.sky.length; i++) g.addColorStop(i / (th.sky.length - 1), th.sky[i]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, LW, LH);

    // aurora bands
    if (th.weatherType === 'aurora') {
      for (var b = 0; b < 4; b++) {
        ctx.save();
        ctx.globalAlpha = 0.12 + Math.sin(time * 0.3 + b * 1.5) * 0.06;
        var colors = ['#00ff87','#7fdbff','#c792ea','#51e898'];
        ctx.strokeStyle = colors[b];
        ctx.lineWidth = 25 + Math.sin(time * 0.5 + b) * 10;
        ctx.beginPath();
        for (var x = 0; x <= LW; x += 6) {
          var y = 80 + b * 50 + Math.sin(x * 0.015 + time * 0.8 + b * 2) * 40 + Math.sin(x * 0.03 + time * 1.2) * 15;
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
      }
    }

    // sunset glow
    if (th.name === 'Hoàng hôn') {
      ctx.save();
      // sun
      var sunY = 180 + Math.sin(time * 0.15) * 10;
      var sg = ctx.createRadialGradient(LW/2, sunY, 20, LW/2, sunY, 160);
      sg.addColorStop(0, 'rgba(255,200,50,.7)');
      sg.addColorStop(0.3, 'rgba(255,120,30,.25)');
      sg.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, LW, LH);
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.arc(LW/2, sunY, 26, 0, 6.283); ctx.fill();
      ctx.restore();
      // clouds
      ctx.fillStyle = 'rgba(60,20,40,.2)';
      for (var c = 0; c < 5; c++) {
        var cx2 = ((c * 90 + time * 8) % (LW + 100)) - 50;
        var cy2 = 60 + c * 40 + Math.sin(c * 2.1) * 20;
        ctx.beginPath(); ctx.ellipse(cx2, cy2, 50+c*8, 14+c*3, 0, 0, 6.283); ctx.fill();
      }
    }

    // draw weather particles
    if (th.weatherType === 'stars' || th.weatherType === 'aurora') {
      for (var i = 0; i < wParts.length; i++) {
        var s = wParts[i];
        if (s.shoot) {
          var a = 0.3+Math.abs(Math.sin(time*0.4+i))*0.7;
          if(a<0.35) continue;
          ctx.save();
          var lg=ctx.createLinearGradient(s.x,s.y,s.x+s.tail,s.y-s.tail*0.3);
          lg.addColorStop(0,'rgba(255,255,255,'+a+')'); lg.addColorStop(1,'rgba(255,255,255,0)');
          ctx.strokeStyle=lg; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x+s.tail,s.y-s.tail*0.3); ctx.stroke();
          ctx.fillStyle='rgba(255,255,255,'+a+')'; ctx.beginPath(); ctx.arc(s.x,s.y,1.5,0,6.283); ctx.fill();
          ctx.restore();
        } else {
          var tw2=Math.sin(time*s.tw+s.to)*0.4+0.6, a2=s.br*tw2;
          ctx.fillStyle='rgba(255,255,255,'+a2+')'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
          if(s.r>1.2){ctx.fillStyle='rgba(200,220,255,'+(a2*0.2)+')'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r*3,0,6.283); ctx.fill();}
        }
      }
    } else if (th.weatherType === 'rain' || th.weatherType === 'thunder') {
      ctx.strokeStyle = th.weatherType==='thunder' ? 'rgba(180,200,220,.4)' : 'rgba(180,210,240,.35)';
      for (var i = 0; i < wParts.length; i++) {
        var p = wParts[i];
        ctx.lineWidth = p.w;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 3, p.y + p.len); ctx.stroke();
      }
      // lightning flash
      if (lightning > 0) {
        ctx.save(); ctx.fillStyle = 'rgba(220,230,255,' + (lightning * 4) + ')'; ctx.fillRect(0,0,LW,LH);
        // bolt
        ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        var bx = 80 + Math.random() * (LW - 160), by = 0;
        ctx.moveTo(bx, by);
        for (var s = 0; s < 6; s++) { bx += (Math.random()-0.5)*40; by += 40+Math.random()*50; ctx.lineTo(bx, by); }
        ctx.stroke();
        ctx.restore();
      }
    } else if (th.weatherType === 'snow') {
      for (var i = 0; i < wParts.length; i++) {
        var p = wParts[i];
        ctx.fillStyle = 'rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
    } else if (th.weatherType === 'petals') {
      for (var i = 0; i < wParts.length; i++) {
        var p = wParts[i];
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = 'rgba(255,180,200,.55)';
        ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.5, 0, 0, 6.283); ctx.fill();
        ctx.fillStyle = 'rgba(255,220,230,.3)';
        ctx.beginPath(); ctx.ellipse(1, -1, p.r*0.6, p.r*0.3, 0.5, 0, 6.283); ctx.fill();
        ctx.restore();
      }
    } else if (th.weatherType === 'sand') {
      for (var i = 0; i < wParts.length; i++) {
        var p = wParts[i];
        ctx.fillStyle = 'rgba(210,185,140,' + p.alpha + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      // haze overlay
      ctx.fillStyle = 'rgba(180,160,120,.08)';
      ctx.fillRect(0, 0, LW, LH);
    }

    // moon (only for themes with moon)
    if (th.moon) {
      ctx.fillStyle = 'rgba(246,239,224,.85)';
      ctx.beginPath(); ctx.arc(280, 80, 28, 0, 6.283); ctx.fill();
      ctx.fillStyle = th.sky[0];
      ctx.beginPath(); ctx.arc(291, 73, 25, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(246,239,224,.06)';
      ctx.beginPath(); ctx.arc(280, 80, 55, 0, 6.283); ctx.fill();
    }

    // ground / water
    var gndCol = th.name==='Tuyết rơi' ? 'rgba(200,215,230,.15)' : th.name==='Bão cát' ? 'rgba(160,140,100,.15)' : 'rgba(246,239,224,.10)';
    ctx.strokeStyle = gndCol; ctx.lineWidth = 1.5;
    for (var row = 0; row < 5; row++) {
      var wy = LH - 55 + row * 13;
      ctx.beginPath();
      for (var wx = 0; wx <= LW; wx += 8) {
        var wyy = wy + Math.sin(wx * 0.05 + time * 1.5 + row) * 3;
        if (wx === 0) ctx.moveTo(wx, wyy); else ctx.lineTo(wx, wyy);
      }
      ctx.stroke();
    }

    // theme name label (top center, subtle)
    ctx.save();
    ctx.fillStyle = 'rgba(246,239,224,.2)';
    ctx.font = '500 10px "Be Vietnam Pro", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(th.name, LW / 2, LH - 12);
    ctx.restore();
  }

  function drawBasket() {
    var x = player.x, y = player.y, w = player.w, h = player.h;
    ctx.save();
    ctx.translate(x, y);
    // bowl
    ctx.fillStyle = '#a5672c';
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0);
    ctx.quadraticCurveTo(0, h * 2, w / 2, 0);
    ctx.closePath();
    ctx.fill();
    // weave
    ctx.strokeStyle = 'rgba(42,26,5,.35)';
    ctx.lineWidth = 1.5;
    for (var i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(i * (w / 8), 0);
      ctx.quadraticCurveTo(i * (w / 16), h * 0.9, i * (w / 24), h * 0.95);
      ctx.stroke();
    }
    // rim
    ctx.fillStyle = '#f2a541';
    ctx.beginPath();
    ctx.ellipse(0, 0, w / 2, 6, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }

  function drawSilver(it) {
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.scale(Math.abs(Math.cos(it.rot)) * 0.5 + 0.5, 1);
    ctx.fillStyle = '#c0c0c0';
    ctx.beginPath(); ctx.arc(0, 0, it.r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, it.r - 2, 0, 6.283); ctx.stroke();
    ctx.fillStyle = '#555';
    ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('10', 0, 1);
    ctx.restore();
  }

  function drawGold(it) {
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.scale(Math.abs(Math.cos(it.rot)) * 0.5 + 0.5, 1);
    ctx.fillStyle = '#f2a541';
    ctx.beginPath(); ctx.arc(0, 0, it.r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#b87a1c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, it.r - 2, 0, 6.283); ctx.stroke();
    ctx.fillStyle = '#6b3a00';
    ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('50', 0, 1);
    ctx.restore();
  }

  function drawDiamond(it) {
    ctx.save();
    ctx.translate(it.x, it.y);
    var s = it.r;
    var pulse = 1 + Math.sin(time * 6) * 0.08;
    ctx.scale(pulse, pulse);
    // glow
    ctx.shadowColor = '#7fdbff'; ctx.shadowBlur = 12;
    // diamond shape
    ctx.fillStyle = '#7fdbff';
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s * 0.7, -s * 0.2);
    ctx.lineTo(s * 0.5, s * 0.8);
    ctx.lineTo(-s * 0.5, s * 0.8);
    ctx.lineTo(-s * 0.7, -s * 0.2);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // facets
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-s * 0.7, -s * 0.2); ctx.lineTo(0, s * 0.3); ctx.lineTo(s * 0.7, -s * 0.2);
    ctx.moveTo(0, -s); ctx.lineTo(0, s * 0.3);
    ctx.moveTo(-s * 0.35, -s * 0.6); ctx.lineTo(-s * 0.5, s * 0.8);
    ctx.moveTo(s * 0.35, -s * 0.6); ctx.lineTo(s * 0.5, s * 0.8);
    ctx.stroke();
    ctx.restore();
  }

  function drawFloats() {
    for (var i = 0; i < floats.length; i++) {
      var f = floats[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, f.life / 0.7);
      ctx.fillStyle = f.color;
      ctx.font = 'bold 18px "Be Vietnam Pro", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }
  }

  function drawFireworks() {
    for (var i = 0; i < fireworks.length; i++) {
      var p = fireworks[i];
      var alpha = Math.max(0, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      // glow
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * alpha, 0, 6.283);
      ctx.fill();
      // trail
      ctx.globalAlpha = alpha * 0.3;
      ctx.beginPath();
      ctx.arc(p.x - p.vx * 0.02, p.y - p.vy * 0.02, p.r * 0.6, 0, 6.283);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawLevelMsg() {
    if (levelMsg <= 0) return;
    ctx.save();
    var alpha = Math.min(1, levelMsg / 0.5); // fade out in last 0.5s
    ctx.globalAlpha = alpha;

    // banner background
    var bh = 70, by = LH * 0.32, bx = 30, bw = LW - 60, br = 16;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath();
    ctx.moveTo(bx + br, by);
    ctx.lineTo(bx + bw - br, by);
    ctx.arcTo(bx + bw, by, bx + bw, by + br, br);
    ctx.lineTo(bx + bw, by + bh - br);
    ctx.arcTo(bx + bw, by + bh, bx + bw - br, by + bh, br);
    ctx.lineTo(bx + br, by + bh);
    ctx.arcTo(bx, by + bh, bx, by + bh - br, br);
    ctx.lineTo(bx, by + br);
    ctx.arcTo(bx, by, bx + br, by, br);
    ctx.closePath();
    ctx.fill();

    // level up text
    ctx.fillStyle = '#f2a541';
    ctx.font = 'bold 22px "Be Vietnam Pro", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⭐ Cấp ' + level + ' ⭐', LW / 2, by + 24);

    // motivation text
    ctx.fillStyle = '#f6efe0';
    ctx.font = '500 14px "Be Vietnam Pro", sans-serif';
    ctx.fillText('Sắp đến phần thưởng rồi, cố lên!', LW / 2, by + 50);

    ctx.restore();
  }

  function drawRock(it) {
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);
    ctx.fillStyle = '#7d8a86';
    ctx.strokeStyle = '#c8402f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var i = 0; i < it.pts.length; i++) {
      var p = it.pts[i];
      if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
    drawBackground();
    for (var i = 0; i < items.length; i++) {
      var t = items[i].type;
      if (t === 'silver') drawSilver(items[i]);
      else if (t === 'gold') drawGold(items[i]);
      else if (t === 'diamond') drawDiamond(items[i]);
      else drawRock(items[i]);
    }
    drawBasket();
    drawFloats();
    drawFireworks();
    drawLevelMsg();
    ctx.restore();
    if (flash > 0) {
      ctx.fillStyle = 'rgba(200,64,47,' + (flash * 1.4) + ')';
      ctx.fillRect(0, 0, LW, LH);
    }
  }

  // ---------- loop ----------
  var last = performance.now();
  time = 0; items = []; floats = []; fireworks = []; levelMsg = 0; score = 0; lives = 3; level = 1; shake = 0; flash = 0; spawnTimer = 0; lastThemeIdx = -1;
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- input ----------
  function setTarget(clientX) {
    var rect = stage.getBoundingClientRect();
    player.target = (clientX - rect.left) / scale;
  }
  cv.addEventListener('pointerdown', function (e) { setTarget(e.clientX); });
  cv.addEventListener('pointermove', function (e) { setTarget(e.clientX); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') player.target -= 60;
    if (e.key === 'ArrowRight') player.target += 60;
  });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  function start() {
    reset();
    state = 'play';
    startScreen.hidden = true;
    overScreen.hidden = true;
    beep(660, 0.1, 'sine', 0.05);
  }
  document.getElementById('playBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);

  updateHud();
})();
</script>
</body>
</html>
